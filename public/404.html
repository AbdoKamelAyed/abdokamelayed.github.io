<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting — ABDO</title>
    <script>
      (function () {
        var path = window.location.pathname.replace(/^\/+|\/+$/g, "");
        var target = path ? "/#/" + path : "/";
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/">ABDO — Personal Digital Hub</a>...</p>
  </body>
</html>
