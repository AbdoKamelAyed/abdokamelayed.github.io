name: Sync GitHub Intelligence

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-github-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect and normalize GitHub data
        env:
          GITHUB_USERNAME: AbdoKamelAyed
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_METRICS_TOKEN: ${{ secrets.GH_METRICS_TOKEN }}
        run: node scripts/sync-github.mjs

      - name: Validate JSON datasets
        run: node scripts/validate-schemas.mjs

      - name: Commit updated GitHub datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/github/
          if git diff --cached --quiet; then
            echo "No GitHub dataset changes to commit."
            exit 0
          fi
          git commit -m "chore(data): sync public GitHub datasets [skip ci]"
          git push
